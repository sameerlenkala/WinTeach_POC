<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WinTeach Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --w-brand:#5B4BDB; --w-brand-bright:#6C5CE7; --w-brand-fg:#FFFFFF; --w-wordmark:#F6A623;
  --w-bg:#EFEEFC; --w-bg-grad:linear-gradient(135deg,#E9E7FB,#F6F5FF,#FBFAFF);
  --w-card:#FFFFFF; --w-sidebar:#FFFFFF; --w-surface-muted:#F1F2F7;
  --w-college-pill:#E5E2FB; --w-streak-bg:#FBE7DA;
  --w-text:#1A1A22; --w-text-2:rgba(26,26,34,.66); --w-text-3:rgba(26,26,34,.45);
  --w-nav-fg:#4B4B57; --w-text-inverse:#FFFFFF;
  --w-border:#E6E5F0; --w-border-strong:#D8D7E6; --w-nav-hover:#F2F1FC; --w-row-hover:#F4F3FD;
  --w-green-fg:#3DA35D; --w-green-bg:#E5F4E9;
  --w-orange-fg:#E4853B; --w-orange-bg:rgba(228,133,59,.14);
  --w-info-fg:#49A9BE; --w-info-bg:rgba(73,169,190,.14);
  --w-red-fg:#DC2133; --w-red-bg:rgba(220,33,51,.12);
  --w-pink-fg:#D9446C; --w-pink-bg:rgba(217,68,108,.14);
  --w-blue-fg:#2563EB; --w-blue-bg:rgba(37,99,235,.12);
  --font-display:'Fredoka',system-ui,sans-serif; --font-sans:'DM Sans',system-ui,sans-serif;
  --shadow-card:0 1px 2px rgba(20,20,50,.04),0 8px 24px -12px rgba(60,50,140,.12);
  --shadow-pop:0 12px 32px -8px rgba(60,50,140,.22);
  --r4:12px; --r5:20px; --r6:48px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-sans);background:var(--w-bg);color:var(--w-text);font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--w-brand);outline-offset:2px}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:284px;flex:0 0 284px;background:var(--w-sidebar);border-right:1px solid var(--w-border);display:flex;flex-direction:column;padding:20px 16px}
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--w-bg);background-image:var(--w-bg-grad)}
.topbar{height:78px;flex:0 0 78px;display:flex;align-items:center;justify-content:space-between;padding:0 36px}
.topbar h1{font-family:var(--font-display);font-weight:600;font-size:20px}
.content{flex:1;overflow-y:auto;padding:0 36px 40px}
.brand{font-family:var(--font-display);font-weight:600;color:var(--w-wordmark);font-size:24px;padding:4px 8px 2px;letter-spacing:.2px}
.brand small{font-size:12px;color:var(--w-text-3);font-family:var(--font-sans);font-weight:500;display:block;letter-spacing:.4px;text-transform:uppercase;margin-top:-2px}
.profile{display:flex;align-items:center;gap:10px;padding:14px 8px 10px;margin-top:6px}
.avatar{width:42px;height:42px;border-radius:50%;flex:0 0 42px;background:linear-gradient(135deg,#6E5EE6,#5B4BDB);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:600;font-size:15px}
.profile .nm{font-family:var(--font-display);font-weight:600;font-size:15px;line-height:1.1}
.profile .em{font-size:12px;color:var(--w-text-3)}
.coll-pill{display:flex;align-items:center;gap:8px;width:100%;height:44px;background:var(--w-college-pill);border:none;border-radius:var(--r4);color:var(--w-brand);font-family:var(--font-display);font-weight:500;font-size:14px;padding:0 14px;margin:6px 0 14px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-family:var(--font-display);font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--w-text-3);padding:10px 12px 6px}
.nav-item{display:flex;align-items:center;gap:12px;height:48px;padding:0 14px;border-radius:13px;border:none;background:transparent;color:var(--w-nav-fg);font-family:var(--font-display);font-weight:500;font-size:15px;width:100%;text-align:left;transition:background .12s,color .12s}
.nav-item svg{width:21px;height:21px;flex:0 0 21px}
.nav-item:hover{background:var(--w-nav-hover);color:var(--w-text)}
.nav-item.active{background:var(--w-brand-bright);color:#fff;box-shadow:0 8px 18px -6px rgba(108,92,231,.55)}
.nav-item .ct{margin-left:auto;font-size:12px;background:var(--w-surface-muted);color:var(--w-text-2);border-radius:var(--r6);padding:1px 8px;font-family:var(--font-sans);font-weight:600}
.nav-item.active .ct{background:rgba(255,255,255,.2);color:#fff}
.icon-btn{width:44px;height:44px;border-radius:13px;border:1px solid var(--w-border);background:var(--w-card);display:flex;align-items:center;justify-content:center;color:var(--w-text-2)}
.icon-btn:hover{color:var(--w-text)}
.icon-btn svg{width:20px;height:20px}
.btn{height:42px;border-radius:var(--r4);font-family:var(--font-display);font-weight:500;font-size:15px;padding:0 22px;border:1px solid transparent;display:inline-flex;align-items:center;gap:8px;transition:background .12s,opacity .12s;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn-primary{background:var(--w-brand-bright);color:#fff}
.btn-primary:hover{background:#5f50d8}
.btn-secondary{background:transparent;border-color:var(--w-border-strong);color:var(--w-text)}
.btn-secondary:hover{background:var(--w-surface-muted)}
.btn-ghost{background:transparent;color:var(--w-text-2)}
.btn-ghost:hover{color:var(--w-text);background:var(--w-surface-muted)}
.btn-sm{height:34px;font-size:13px;padding:0 14px;border-radius:10px}
.btn:disabled{opacity:.4;pointer-events:none}
.card{background:var(--w-card);border:1px solid var(--w-border);border-radius:var(--r5);padding:28px;box-shadow:var(--shadow-card)}
.card.compact{padding:18px;border-radius:16px}
.h1{font-family:var(--font-display);font-weight:600;font-size:28px}
.h2{font-family:var(--font-display);font-weight:600;font-size:20px}
.h3{font-family:var(--font-display);font-weight:600;font-size:17px}
.section-label{font-family:var(--font-display);font-weight:600;font-size:14px;color:var(--w-text-2)}
.lead{font-size:15px;color:var(--w-text-2)}
.meta{font-size:12.5px;color:var(--w-text-2)}
.badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-display);font-weight:600;font-size:13px;border-radius:var(--r6);padding:3px 11px;white-space:nowrap}
.badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.b-green{background:var(--w-green-bg);color:var(--w-green-fg)}
.b-orange{background:var(--w-orange-bg);color:var(--w-orange-fg)}
.b-info{background:var(--w-info-bg);color:var(--w-info-fg)}
.b-red{background:var(--w-red-bg);color:var(--w-red-fg)}
.b-pink{background:var(--w-pink-bg);color:var(--w-pink-fg)}
.b-blue{background:var(--w-blue-bg);color:var(--w-blue-fg)}
.b-muted{background:var(--w-surface-muted);color:var(--w-text-2)}
.bloom{display:inline-block;font-family:var(--font-sans);font-weight:600;font-size:11px;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:2px 7px}
.bl-remember{background:#EEF2FF;color:#4F5BD5}.bl-understand{background:#E5F4E9;color:#3DA35D}
.bl-apply{background:#FFF3E2;color:#E4853B}.bl-analyze{background:#E7F6F9;color:#3895AD}
.bl-evaluate{background:#FCE8EF;color:#D9446C}.bl-create{background:#F0EBFF;color:#6C5CE7}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-family:var(--font-sans);font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--w-text-3);padding:0 16px 12px;border-bottom:1px solid var(--w-border)}
.tbl td{padding:16px;border-bottom:1px solid var(--w-border);vertical-align:middle}
.tbl tr.row{cursor:pointer;transition:background .12s}
.tbl tr.row:hover td{background:var(--w-row-hover)}
.tbl tr:last-child td{border-bottom:none}
.course-code{font-family:var(--font-display);font-weight:600;font-size:13px;color:var(--w-brand)}
.course-name{font-family:var(--font-display);font-weight:600;font-size:15px}
.course-sub{font-size:12.5px;color:var(--w-text-2)}
.field{margin-bottom:18px}
.field-label{font-family:var(--font-display);font-weight:600;font-size:13px;margin-bottom:6px;display:block}
.field-label .opt{color:var(--w-text-3);font-weight:500}
.input,.select,.textarea{width:100%;background:var(--w-surface-muted);border:1px solid transparent;border-radius:var(--r4);padding:11px 14px;font-family:var(--font-sans);font-size:14px;color:var(--w-text)}
.input::placeholder,.textarea::placeholder{color:var(--w-text-3)}
.input:focus,.select:focus,.textarea:focus{background:#fff;border-color:var(--w-brand);outline:none}
.textarea{min-height:88px;resize:vertical;line-height:1.6}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 20px}
.stepper{display:flex;align-items:center;gap:0;margin-bottom:28px}
.step{display:flex;align-items:center;gap:10px;color:var(--w-text-3)}
.step .num{width:28px;height:28px;border-radius:50%;background:var(--w-surface-muted);color:var(--w-text-2);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:600;font-size:13px;flex:0 0 28px}
.step .lbl{font-family:var(--font-display);font-weight:500;font-size:14px}
.step.active{color:var(--w-text)}.step.active .num{background:var(--w-brand-bright);color:#fff}
.step.done .num{background:var(--w-green-bg);color:var(--w-green-fg)}.step.done{color:var(--w-text-2)}
.step-line{flex:1;height:2px;background:var(--w-border);margin:0 14px;min-width:24px}
.step-line.done{background:var(--w-green-fg);opacity:.4}
.upload-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.upload-tab{height:36px;padding:0 16px;border-radius:10px;border:1px solid var(--w-border-strong);background:transparent;font-family:var(--font-display);font-weight:500;font-size:13px;color:var(--w-text-2);display:inline-flex;align-items:center;gap:7px}
.upload-tab svg{width:16px;height:16px}
.upload-tab.active{background:var(--w-brand-bright);border-color:var(--w-brand-bright);color:#fff}
.dropzone{border:2px dashed var(--w-border-strong);border-radius:var(--r5);padding:40px 24px;text-align:center;background:var(--w-surface-muted);cursor:pointer;transition:border-color .12s,background .12s}
.dropzone:hover{border-color:var(--w-brand);background:#fff}
.dropzone svg{width:34px;height:34px;color:var(--w-brand);margin-bottom:12px}
.dropzone .big{font-family:var(--font-display);font-weight:600;font-size:16px;margin-bottom:4px}
.file-chip{display:inline-flex;align-items:center;gap:10px;background:var(--w-college-pill);color:var(--w-brand);border-radius:var(--r4);padding:10px 14px;font-family:var(--font-display);font-weight:500;font-size:14px;margin-top:14px}
.file-chip svg{width:18px;height:18px}
.aico{width:36px;height:36px;border-radius:10px;background:var(--w-college-pill);color:var(--w-brand);display:flex;align-items:center;justify-content:center;flex:0 0 36px}
.aico svg{width:18px;height:18px}
.co-row{display:flex;align-items:flex-start;gap:14px;padding:16px;border:1px solid var(--w-border);border-radius:16px;margin-bottom:12px;background:#fff}
.co-row.dismissed{opacity:.5}
.co-id{font-family:var(--font-display);font-weight:600;font-size:13px;color:var(--w-brand);flex:0 0 56px;padding-top:2px}
.co-body{flex:1;min-width:0}
.co-text{font-size:14px;line-height:1.55;margin-bottom:8px}
.co-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.co-actions{display:flex;gap:6px;flex:0 0 auto;align-items:center}
.co-icon{width:32px;height:32px;border-radius:9px;border:1px solid var(--w-border);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--w-text-2)}
.co-icon:hover{color:var(--w-text);background:var(--w-surface-muted)}
.co-icon svg{width:16px;height:16px}
.co-icon.danger:hover{color:var(--w-red-fg);background:var(--w-red-bg)}
.delta-banner{display:flex;align-items:center;gap:12px;background:var(--w-blue-bg);border-radius:var(--r4);padding:14px 16px;margin-bottom:18px}
.delta-banner svg{width:20px;height:20px;color:var(--w-blue-fg);flex:0 0 20px}
.delta-banner .txt{font-size:13.5px;color:var(--w-text);line-height:1.5}
.unit{border:1px solid var(--w-border);border-radius:16px;margin-bottom:14px;overflow:hidden;background:#fff}
.unit-head{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--w-surface-muted)}
.unit-head .un{font-family:var(--font-display);font-weight:600;font-size:13px;color:var(--w-brand)}
.unit-head .ut{font-family:var(--font-display);font-weight:600;font-size:15px}
.unit-head .ct{margin-left:auto;font-size:12px;color:var(--w-text-2)}
.topic-item{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--w-border);cursor:pointer;transition:background .12s}
.topic-item:last-child{border-bottom:none}
.topic-item:hover{background:var(--w-row-hover)}
.topic-item .tname{font-family:var(--font-display);font-weight:600;font-size:14px}
.topic-item .tsub{font-size:12px;color:var(--w-text-2);margin-top:2px}
.subchip{display:inline-block;font-size:11px;color:var(--w-text-2);background:var(--w-surface-muted);border-radius:6px;padding:2px 8px;margin:2px 4px 0 0}
.progress{height:8px;border-radius:var(--r6);background:var(--w-surface-muted);overflow:hidden}
.progress>span{display:block;height:100%;background:var(--w-brand-bright);border-radius:var(--r6);transition:width .3s}
.flow{display:flex;align-items:stretch;gap:0}
.flow-stage{flex:1;min-width:0}
.flow-conn{flex:0 0 28px;display:flex;align-items:center;justify-content:center;color:var(--w-text-3)}
.flow-conn svg{width:18px;height:18px}
.artifact{border:1px solid var(--w-border);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;height:100%}
.artifact .ahead{display:flex;align-items:center;gap:10px}
.artifact .atitle{font-family:var(--font-display);font-weight:600;font-size:14px}
.artifact .asub{font-size:11px;color:var(--w-text-3)}
.parallel{display:grid;grid-template-columns:1fr;gap:12px;flex:1}
.score{background:linear-gradient(135deg,#6E5EE6,#5B4BDB);border-radius:24px;color:#fff;padding:26px 28px;display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.score>div:first-child{flex:1 1 280px;min-width:0}
.score-tiles{flex:0 0 auto}
.score .eyebrow{font-family:var(--font-display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.72);margin-bottom:8px}
.score-tiles{display:flex;gap:12px}
.score-tile{background:rgba(255,255,255,.12);border-radius:14px;padding:12px 16px;min-width:90px}
.score-tile .l{font-family:var(--font-display);font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.7);margin-bottom:4px}
.score-tile .v{font-family:var(--font-display);font-weight:600;font-size:22px}
.page-actions{display:flex;align-items:center;gap:10px}
.breadcrumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--w-text-2);margin-bottom:18px;flex-wrap:wrap}
.breadcrumb a{color:var(--w-brand);text-decoration:none;font-weight:500;cursor:pointer}
.breadcrumb svg{width:14px;height:14px;color:var(--w-text-3)}
.flex{display:flex}.between{justify-content:space-between}.center{align-items:center}.gap{gap:12px}.wrap{flex-wrap:wrap}
.mb8{margin-bottom:8px}.mb16{margin-bottom:16px}.mb24{margin-bottom:24px}.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.empty{text-align:center;padding:60px 20px;color:var(--w-text-2)}
.empty svg{width:48px;height:48px;color:var(--w-text-3);margin-bottom:16px}
.modal-bg{position:fixed;inset:0;background:rgba(26,26,34,.4);display:flex;align-items:center;justify-content:center;z-index:50;padding:24px}
.modal{background:#fff;border-radius:var(--r5);padding:26px;width:100%;max-width:520px;box-shadow:var(--shadow-pop);max-height:88vh;overflow-y:auto}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--w-text);color:#fff;padding:12px 20px;border-radius:var(--r4);font-family:var(--font-display);font-weight:500;font-size:14px;z-index:60;box-shadow:var(--shadow-pop);display:flex;align-items:center;gap:10px}
.toast svg{width:18px;height:18px;color:#7CE2A0}
.info-card{border:1px solid var(--w-border);border-radius:16px;padding:18px;background:#fff}
.comap{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-display);font-weight:600;font-size:11px;color:var(--w-brand);background:var(--w-college-pill);border-radius:6px;padding:2px 8px}
.ico18{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;flex:0 0 18px}.ico18 svg{width:18px;height:18px}
.lib-card{border:1px solid var(--w-border);border-radius:16px;padding:18px;background:#fff;display:flex;flex-direction:column;gap:8px}
.lib-cat{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-display);font-weight:600;font-size:11px;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:2px 8px}
.lc-ai{background:#F0EBFF;color:#6C5CE7}.lc-industry{background:var(--w-info-bg);color:var(--w-info-fg)}
.maptbl{min-width:520px}.maptbl th,.maptbl td{padding:11px 12px}.maptbl thead th{text-align:center}.maptbl th:first-child,.maptbl td:first-child{text-align:left}
.mapval{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;font-family:var(--font-display);font-weight:600;font-size:13px}
.mv1{background:var(--w-info-bg);color:var(--w-info-fg)}.mv2{background:var(--w-orange-bg);color:var(--w-orange-fg)}.mv3{background:var(--w-green-bg);color:var(--w-green-fg)}
.mapempty{color:var(--w-text-3)}
.maplegend{display:inline-flex;align-items:center;gap:6px;margin-right:14px}
/* ===== Dashboard ===== */
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.dash-lead{font-size:14.5px;color:var(--w-text-2);margin:-2px 0 22px}
.kpi{background:var(--w-card);border:1px solid var(--w-border);border-radius:var(--r5);padding:20px;box-shadow:var(--shadow-card);display:flex;flex-direction:column;gap:12px;text-align:left;width:100%}
.kpi.click{cursor:pointer;transition:box-shadow .14s,transform .14s,border-color .14s}
.kpi.click:hover{box-shadow:var(--shadow-pop);transform:translateY(-2px);border-color:var(--w-border-strong)}
.kpi .ktop{display:flex;align-items:center;justify-content:space-between}
.kpi .kicon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.kpi .kicon svg{width:20px;height:20px}
.kpi .kgo{color:var(--w-text-3)}.kpi .kgo svg{width:16px;height:16px}
.kpi .kval{font-family:var(--font-display);font-weight:600;font-size:30px;line-height:1}
.kpi .klabel{font-family:var(--font-display);font-weight:600;font-size:13.5px;color:var(--w-text);margin-top:-4px}
.kpi .ksub{font-size:12px;color:var(--w-text-3);margin-top:-6px}
.dash-cols{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;margin-bottom:16px}
.attn-row{display:flex;align-items:center;gap:14px;padding:14px 2px}
.attn-row+.attn-row{border-top:1px solid var(--w-border)}
.attn-ico{width:38px;height:38px;border-radius:11px;flex:0 0 38px;display:flex;align-items:center;justify-content:center}
.attn-ico svg{width:18px;height:18px}
.attn-tx{min-width:0;flex:1}
.attn-tx .at{font-family:var(--font-display);font-weight:600;font-size:14px}
.attn-tx .ad{font-size:12.5px;color:var(--w-text-2);margin-top:1px}
.snap-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.snap-row .sl{font-family:var(--font-display);font-weight:500;font-size:13px;flex:0 0 92px;display:flex;align-items:center;gap:7px}

function mapCols(c){const inst=instOf(c);return[...inst.pos.map(p=>p.code),...applicablePsos(inst,c.major||'CSE').map(p=>p.code)];}
function ensureMapping(c){
  const cols=mapCols(c);const cos=c.cos||[];
  if(!c.coMapping)c.coMapping={};
  cos.forEach((co,ci)=>{c.coMapping[co.id]=c.coMapping[co.id]||{};
    cols.forEach((col,xi)=>{if(c.coMapping[co.id][col]===undefined){
      const r=(ci*3+xi*5+(col.startsWith('PSO')?2:0))%4;c.coMapping[co.id][col]=r===0?'':r; // 0 blank, else 1-3
    }});});
  return c.coMapping;
}
function coRefFor(c,unitIndex){return(c.cos&&c.cos[unitIndex])?c.cos[unitIndex].id:'CO'+(unitIndex+1);}

function seedCourse(code,name,sem,credits,status,fill,institute,major){
  const c=JSON.parse(JSON.stringify(SAMPLE));
  c.code=code;c.name=name;c.sem=sem;c.credits=credits;c.status=status;
  c.institute=institute||'Winnify';c.major=major||'CSE';
  c.units.forEach(u=>u.topics.forEach(t=>{t.id=nid();
    if(fill==='full')t.artifacts={notes:100,preassess:100,quiz:100,flash:100};
    else if(fill==='partial')t.artifacts=Math.random()>.5?{notes:100,preassess:100,quiz:100,flash:100}:{notes:100,preassess:60,quiz:40,flash:20};
    else t.artifacts=newArtifacts();
  }));
  delete c.libraryDelta;
  return c;
}

function coursePct(c){const ts=allTopics(c);if(!ts.length)return 0;return Math.round(ts.reduce((s,x)=>s+topicPct(x.topic),0)/ts.length);}
function pendingJobs(){return courses.reduce((s,c)=>s+allTopics(c).filter(x=>topicState(x.topic)!=='ready').length,0);}
function topicBadge(t){const st=topicState(t);if(st==='ready')return`<span class="badge b-green"><span class="dot"></span>Ready</span>`;if(st==='generating')return`<span class="badge b-info">Generating · ${topicPct(t)}%</span>`;return`<span class="badge b-orange">Pending</span>`;}
function statusBadge(s){if(s==='active')return`<span class="badge b-green"><span class="dot"></span>Active</span>`;if(s==='draft')return`<span class="badge b-orange">Draft</span>`;return`<span class="badge b-muted">${s}</span>`;}

function setNav(a){document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.nav===a));}
function go(r){route=r;render();}
window.go=go;
document.querySelectorAll('.nav-item').forEach(n=>n.addEventListener('click',()=>{currentInst=null;go(n.dataset.nav);}));
function render(){
  const v=$('#view'),t=$('#pageTitle'),a=$('#topActions');a.innerHTML='';
  $('#navCourseCount').textContent=courses.length;
  $('#navGenCount').textContent=pendingJobs();
  if($('#navInstCount'))$('#navInstCount').textContent=institutes.length;
  if($('#navAddCount'))$('#navAddCount').textContent=ADDITIONAL_LIBRARY.length;
  if(route==='dashboard'){setNav('dashboard');t.textContent='Dashboard';renderDashboard(v,a);}
  else if(route==='courses'){setNav('courses');t.textContent='Courses';renderCourses(v,a);}
  else if(route==='create'||route==='editCourse'){setNav('courses');t.textContent=draft.mode==='edit'?'Edit Course':'Create New Course';renderCreate(v,a);}
  else if(route==='coursePage'){setNav('courses');t.textContent=currentCourse.name;renderCoursePage(v,a);}
  else if(route==='topicPage'){setNav('courses');t.textContent=currentTopic.name;renderTopicPage(v,a);}
  else if(route==='generation'){setNav('generation');t.textContent='Content Generation';renderGeneration(v,a);}
  else if(route==='institutes'){setNav('institutes');t.textContent='Institute PO & PSO';renderInstitutes(v,a);}
  else if(route==='addlib'){setNav('addlib');t.textContent='Additional Course Library';renderAddLibrary(v,a);}
  else{setNav(route);t.textContent=route[0].toUpperCase()+route.slice(1);v.innerHTML=`<div class="card"><div class="empty">${I.empty}<div class="h3 mb8">${t.textContent}</div><div class="lead">Out of scope for this prototype.</div></div></div>`;}
}

    return`<div class="flex between center mb16 mt8"><div class="section-label">${cat==='AI'?'AI & Emerging Tech':'Industry-Relevant Skills'}</div><span class="meta">${items.length} topics</span></div>

function renderDashboard(v,a){
  a.innerHTML=`<button class="icon-btn">${I.bell}</button><button class="btn btn-primary" id="nc">${I.plus}Create new course</button>`;
  a.querySelector('#nc').onclick=startCreate;

  if(!courses.length){
    v.innerHTML=`<div class="card"><div class="empty">${I.empty}<div class="h3 mb8">Welcome to WinTeach</div><div class="lead mb24">Upload a syllabus to generate your first course plan — notes, quizzes, pre-assessments and flashcards, CO-aligned.</div><button class="btn btn-primary" onclick="startCreate()">${I.plus}Create new course</button></div></div>`;
    return;
  }

  // ---- aggregates (read-only) ----
  const ts=courses.flatMap(allTopics);
  const total=ts.length;
  const ready=ts.filter(x=>topicState(x.topic)==='ready').length;
  const generating=ts.filter(x=>topicState(x.topic)==='generating').length;
  const pending=ts.filter(x=>topicState(x.topic)==='pending').length;
  const activeCount=courses.filter(c=>c.status==='active').length;
  const draftCount=courses.filter(c=>c.status==='draft').length;
  const overall=total?Math.round(ready/total*100):0;
  const pct=n=>total?Math.round(n/total*100):0;
  const hour=new Date().getHours();
  const greet=hour<12?'Good morning':hour<18?'Good afternoon':'Good evening';

  // ---- KPI cards ----
  const kpi=(nav,tintBg,tintFg,ico,val,label,sub)=>`
    <button class="kpi click" data-go="${nav}">
      <div class="ktop"><div class="kicon" style="background:${tintBg};color:${tintFg}">${ico}</div><span class="kgo">${I.arrow}</span></div>
      <div class="kval">${val}</div><div class="klabel">${label}</div><div class="ksub">${sub}</div>
    </button>`;
  const kpis=`<div class="grid-4" style="margin-bottom:16px">
    ${kpi('courses','var(--w-college-pill)','var(--w-brand)',I.notes,courses.length,'Courses',`${activeCount} active · ${draftCount} draft`)}
    ${kpi('generation','var(--w-green-bg)','var(--w-green-fg)',I.check,`${ready}/${total}`,'Topics ready',`${overall}% generated`)}
    ${kpi('generation','var(--w-orange-bg)','var(--w-orange-fg)',I.spark,generating+pending,'In the queue',`${generating} generating · ${pending} not started`)}
    ${kpi('institutes','var(--w-info-bg)','var(--w-info-fg)',I.file,institutes.length,'Institutes',`PO / PSO frameworks`)}
  </div>`;

  // ---- needs attention ----
  const items=[];
  courses.filter(c=>c.status==='draft').forEach(c=>{
    const left=allTopics(c).filter(x=>topicState(x.topic)!=='ready').length;
    items.push({bg:'var(--w-orange-bg)',fg:'var(--w-orange-fg)',ico:I.spark,at:`${c.code} · ${c.name} is in draft`,ad:`${left} topic${left!==1?'s':''} still need generation before it can go active`,cta:'Open course',act:()=>{currentCourse=c;go('coursePage');}});
  });
  if(generating>0)items.push({bg:'var(--w-info-bg)',fg:'var(--w-info-fg)',ico:I.redo,at:`${generating} topic${generating!==1?'s':''} generating now`,ad:'Live jobs in progress across your courses',cta:'View jobs',act:()=>go('generation')});
  if(pending>0)items.push({bg:'var(--w-college-pill)',fg:'var(--w-brand)',ico:I.arrow,at:`${pending} topic${pending!==1?'s':''} not started`,ad:'Queued sub-topics with no artifacts yet',cta:'Go to generation',act:()=>go('generation')});
  const attnBody=items.length?items.slice(0,4).map((it,i)=>`
    <div class="attn-row">
      <div class="attn-ico" style="background:${it.bg};color:${it.fg}">${it.ico}</div>
      <div class="attn-tx"><div class="at">${it.at}</div><div class="ad">${it.ad}</div></div>
      <button class="btn btn-secondary btn-sm" data-attn="${i}">${it.cta}</button>
    </div>`).join('')
    :`<div class="attn-row"><div class="attn-ico" style="background:var(--w-green-bg);color:var(--w-green-fg)">${I.check}</div><div class="attn-tx"><div class="at">All caught up</div><div class="ad">Every topic across your courses is generated and ready.</div></div></div>`;

  // ---- pipeline snapshot ----
  const snapRow=(color,label,n)=>`<div class="snap-row"><span class="sl"><span class="dot" style="background:${color}"></span>${label}</span><div class="progress"><span style="width:${pct(n)}%;background:${color}"></span></div><span class="sv">${n}</span></div>`;
  const snapshot=`<div class="card">
    <div class="flex between center mb16"><div class="h3">Pipeline snapshot</div></div>
    <div class="flex gap center mb24">
      <div class="ring" style="--p:${overall}"><div class="hole"><b>${overall}%</b><span>Ready</span></div></div>
      <div style="flex:1;min-width:0">
        <div class="meta mb8">${ready} of ${total} sub-topics fully generated</div>
        <div class="lead" style="font-size:13.5px">across ${courses.length} courses · ${activeCount} live for delivery</div>
      </div>
    </div>
    ${snapRow('var(--w-green-fg)','Ready',ready)}
    ${snapRow('var(--w-info-fg)','Generating',generating)}
    ${snapRow('var(--w-orange-fg)','Not started',pending)}
  </div>`;

  // ---- recent courses ----
  const recent=courses.slice(0,4).map((c,i)=>{const tt=allTopics(c);return`
    <tr class="row" data-rc="${courses.indexOf(c)}">
      <td><div class="course-code">${c.code}</div><div class="course-name">${c.name}</div><div class="course-sub">${c.institute||'Winnify'} · ${c.major||'CSE'} · Sem ${c.sem}</div></td>
      <td style="min-width:170px"><div class="progress mb8"><span style="width:${coursePct(c)}%"></span></div><span class="meta">${tt.filter(x=>topicState(x.topic)==='ready').length}/${tt.length} topics ready</span></td>
      <td>${statusBadge(c.status)}</td>
    </tr>`;}).join('');
  const recentCard=`<div class="card" style="padding:8px 12px">
    <div class="flex between center" style="padding:14px 8px 6px"><div class="section-label">Recent courses</div><button class="btn btn-ghost btn-sm" data-go="courses">View all ${I.arrow}</button></div>
    <table class="tbl"><thead><tr><th>Course</th><th>Generation</th><th>Status</th></tr></thead><tbody>${recent}</tbody></table>
  </div>`;

  v.innerHTML=`<div class="dash-lead">${greet}, Sameer — here's where your content pipeline stands.</div>
    ${kpis}
    <div class="dash-cols">
      <div class="card"><div class="flex between center mb8"><div class="h3">Needs attention</div>${items.length?`<span class="badge b-orange">${items.length}</span>`:''}</div>${attnBody}</div>
      ${snapshot}
    </div>
    ${recentCard}`;

  // ---- wiring ----
  v.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  v.querySelectorAll('[data-attn]').forEach(b=>b.onclick=()=>items[+b.dataset.attn].act());
  v.querySelectorAll('tr[data-rc]').forEach(r=>r.onclick=()=>{currentCourse=courses[+r.dataset.rc];go('coursePage');});
}

function renderCourses(v,a){
  a.innerHTML=`<button class="icon-btn">${I.bell}</button><button class="btn btn-primary" id="nc">${I.plus}Create new course</button>`;
  a.querySelector('#nc').onclick=startCreate;
  if(!courses.length){v.innerHTML=`<div class="card"><div class="empty">${I.empty}<div class="h3 mb8">No courses yet</div><div class="lead mb24">Upload a syllabus to generate your first course plan.</div><button class="btn btn-primary" onclick="startCreate()">${I.plus}Create new course</button></div></div>`;return;}
  const rows=courses.map((c,i)=>{const ts=allTopics(c);return`
    <tr class="row" data-i="${i}">
      <td><div class="course-code">${c.code}</div><div class="course-name">${c.name}</div><div class="course-sub">${c.institute||'Winnify'} · ${c.major||'CSE'} · Sem ${c.sem}</div></td>
      <td><span class="meta">${c.units.length} units · ${ts.length} topics</span></td>
      <td style="min-width:160px"><div class="progress mb8"><span style="width:${coursePct(c)}%"></span></div><span class="meta">${ts.filter(x=>topicState(x.topic)==='ready').length}/${ts.length} topics ready</span></td>
      <td>${statusBadge(c.status)}</td>
      <td style="text-align:right"><button class="co-icon" data-edit="${i}" title="Edit course">${I.edit}</button></td>
    </tr>`;}).join('');
  v.innerHTML=`<div class="flex between center mb16"><div class="section-label">${courses.length} courses · CIET R24</div></div>
    <div class="card" style="padding:8px 12px"><table class="tbl"><thead><tr><th>Course</th><th>Structure</th><th>Generation</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
  v.querySelectorAll('tr.row').forEach(r=>r.onclick=e=>{
    if(e.target.closest('[data-edit]')){startEdit(courses[+r.dataset.i]);return;}
    currentCourse=courses[+r.dataset.i];go('coursePage');
  });
}

function startCreate(){
  draft={mode:'create',step:1,details:{code:'',name:'',program:'B.Tech CSE',sem:'',credits:'',regulation:'CIET R24'},method:'upload',fileName:'',extracted:null,delta:[]};
  go('create');
}
window.startCreate=startCreate;
function startEdit(c){
  draft={mode:'edit',step:3,target:c,details:{code:c.code,name:c.name,institute:c.institute||'Winnify',program:c.program,major:c.major||'CSE',sem:c.sem,credits:c.credits,regulation:c.regulation||'CIET R24'},method:'upload',fileName:'(existing syllabus)',extracted:JSON.parse(JSON.stringify(c)),delta:[]};
  go('editCourse');
}
function stepper(step){
  const steps=draft.mode==='edit'?['Course details','Syllabus','Edit course plan']:['Course details','Upload & extract','Finalize COs'];
  return`<div class="stepper">${steps.map((s,i)=>{const n=i+1;const cls=n<step?'done':n===step?'active':'';const line=i<steps.length-1?`<div class="step-line ${n<step?'done':''}"></div>`:'';return`<div class="step ${cls}"><div class="num">${n<step?I.check:n}</div><div class="lbl">${s}</div></div>${line}`;}).join('')}</div>`;
}
function renderCreate(v,a){
  a.innerHTML=`<button class="btn btn-ghost" onclick="go('${draft.mode==='edit'?'coursePage':'courses'}')">Cancel</button>`;
  if(draft.step===1)return createStep1(v);
  if(draft.step===2)return createStep2(v);
  if(draft.step===3)return createStep3(v);
}
function createStep1(v){
  const d=draft.details;
  v.innerHTML=`<div class="breadcrumb"><a onclick="go('courses')">Courses</a>${I.chevron}<span>${draft.mode==='edit'?d.code+' · Edit':'New course'}</span></div>
    ${stepper(1)}
    <div class="card" style="max-width:760px"><div class="h2 mb8">Course details</div>
      <div class="lead mb24">${draft.mode==='edit'?'Update the course identity.':'Identify the course. You\u2019ll attach the syllabus next.'}</div>
      <div class="grid-2">
        <div class="field"><label class="field-label">Course code</label><input class="input" id="f_code" placeholder="CSE125" value="${d.code}"></div>
        <div class="field"><label class="field-label">Course name</label><input class="input" id="f_name" placeholder="Python Programming" value="${d.name}"></div>
      </div>
      <div class="grid-2">
        <div class="field"><label class="field-label">Institute</label><select class="select" id="f_inst">${instNames().map(p=>`<option ${p===(d.institute||'Winnify')?'selected':''}>${p}</option>`).join('')}</select></div>
        <div class="field"><label class="field-label">Program</label><select class="select" id="f_prog">${['B.Tech CSE','B.Tech ECE','B.Tech Mech','B.Tech Civil','MCA','MBA'].map(p=>`<option ${p===d.program?'selected':''}>${p}</option>`).join('')}</select></div>
      </div>
      <div class="grid-2">
        <div class="field"><label class="field-label">Major <span class="opt">(drives applicable PSOs)</span></label><select class="select" id="f_major">${MAJORS.map(p=>`<option ${p===(d.major||'CSE')?'selected':''}>${p}</option>`).join('')}</select></div>
        <div class="field"><label class="field-label">Regulation</label><input class="input" id="f_reg" value="${d.regulation}"></div>
      </div>
      <div class="grid-2">
        <div class="field"><label class="field-label">Semester</label><input class="input" id="f_sem" type="number" placeholder="3" value="${d.sem}"></div>
        <div class="field"><label class="field-label">Credits</label><input class="input" id="f_cr" type="number" placeholder="3" value="${d.credits}"></div>
      </div>
      <div class="flex between center mt16"><span class="meta">Step 1 of 3</span>
        <button class="btn btn-primary" id="s1">${draft.mode==='edit'?'Continue to plan':'Continue to syllabus'} ${I.chevron}</button></div>
    </div>`;
  v.querySelector('#s1').onclick=()=>{
    draft.details={code:val('f_code')||'CSE125',name:val('f_name')||'Python Programming',institute:val('f_inst'),program:val('f_prog'),major:val('f_major'),sem:val('f_sem')||'3',credits:val('f_cr')||'3',regulation:val('f_reg')};
    draft.step=draft.mode==='edit'?3:2;render();

function createStep2(v){
  v.innerHTML=`<div class="breadcrumb"><a onclick="go('courses')">Courses</a>${I.chevron}<span>${draft.details.code} · Syllabus</span></div>
    ${stepper(2)}
    <div class="card" style="max-width:760px"><div class="h2 mb8">Upload syllabus</div>
      <div class="lead mb24">WinTeach parses the syllabus into Units → Topics → Subtopics, and maps a course outcome to each topic.</div>
      <div class="upload-tabs" id="uT"><button class="upload-tab ${draft.method==='upload'?'active':''}" data-m="upload">${I.upload}PDF / Image</button><button class="upload-tab ${draft.method==='paste'?'active':''}" data-m="paste">${I.text}Paste text</button></div>
      <div id="uB"></div><div id="exR"></div>
      <div class="flex between center mt24"><button class="btn btn-ghost" onclick="draft.step=1;render()">${I.back}Back</button>
        <button class="btn btn-primary" id="s2" disabled>Continue to finalize COs ${I.chevron}</button></div>
    </div>`;
  v.querySelectorAll('#uT .upload-tab').forEach(b=>b.onclick=()=>{draft.method=b.dataset.m;createStep2(v);});
  drawUpload();if(draft.extracted)drawExtract();
  $('#s2').disabled=!draft.extracted;
  $('#s2').onclick=()=>{prepFinalize();draft.step=3;render();};
}
function drawUpload(){
  const b=$('#uB');
  if(draft.method==='upload'){
    b.innerHTML=`<div class="dropzone" id="dz">${I.upload}<div class="big">Drop a PDF or image, or browse</div><div class="meta">.pdf, .png, .jpg · up to 20 MB</div>${draft.fileName?`<div class="file-chip">${I.file}${draft.fileName}</div>`:''}</div>
      <div class="flex gap mt16 wrap"><button class="btn btn-secondary btn-sm" id="us">${I.image}Use sample (Python Programming.pdf)</button></div>`;
    $('#dz').onclick=()=>extract('Python_Programming_R24.pdf');
    $('#us').onclick=e=>{e.stopPropagation();extract('Python_Programming_R24.pdf');};
  }else{
    b.innerHTML=`<div class="field"><textarea class="textarea" id="pb" style="min-height:200px">${SAMPLE_TEXT}</textarea></div><button class="btn btn-secondary btn-sm" id="pp">${I.spark}Parse pasted text</button>`;
    $('#pp').onclick=()=>extract('Pasted text');
  }
}
function extract(name){
  draft.fileName=name;
  $('#exR').innerHTML=`<div class="card compact mt16" style="display:flex;align-items:center;gap:14px;border-style:dashed"><div class="aico">${I.spark}</div><div><div class="h3" style="font-size:15px">Extracting syllabus…</div><div class="meta" id="es">Reading document</div></div></div>`;
  const stages=['Reading document','Detecting units, topics & subtopics','Mapping a CO to each topic','Tagging Bloom\u2019s levels','Done'];
  let i=0;const iv=setInterval(()=>{if(!draft){clearInterval(iv);return;}i++;if(i<stages.length&&$('#es'))$('#es').textContent=stages[i];
    if(i>=stages.length-1){clearInterval(iv);draft.extracted=JSON.parse(JSON.stringify(SAMPLE));if($('#exR'))drawExtract();if($('#s2'))$('#s2').disabled=false;}},500);
}
function drawExtract(){
  const e=draft.extracted;e.cos=e.cos||[];
  if(!draft.addTopics)draft.addTopics=ADDITIONAL_LIBRARY.map(s=>({...s,state:'open'}));
  if(draft.addTopicsOpen===undefined)draft.addTopicsOpen=false;
  const addCount=draft.addTopics.filter(s=>s.state!=='added').length;
  const nt=e.units.reduce((s,u)=>s+u.topics.length,0);const ns=e.units.reduce((s,u)=>s+u.topics.reduce((a,t)=>a+t.subs.length,0),0);
  const cos=e.cos;
  $('#exR').innerHTML=`<div class="card compact mt16" style="background:var(--w-green-bg);border:none;display:flex;align-items:center;gap:12px"><span class="badge b-green"><span class="dot"></span>Extracted</span><span class="meta" style="color:var(--w-text)">${e.units.length} units · ${nt} topics · ${ns} subtopics · ${cos.length} course outcomes</span><span class="meta" style="margin-left:auto;color:var(--w-text-2)">Review &amp; edit before continuing</span></div>
    <div class="flex between center mt24 mb16"><div class="section-label">Course Outcomes — ${cos.length} extracted</div><button class="btn btn-secondary btn-sm" id="exAddCo">${I.plus}Add CO</button></div>
    ${cos.length?cos.map((co,i)=>`<div class="co-row" style="margin-bottom:8px"><div class="co-id">${co.id}</div><div class="co-body"><div class="co-text">${co.text}</div><div class="co-meta"><span class="bloom ${bloomClass(co.bloom)}">${co.bloom}</span></div></div><div class="co-actions"><button class="co-icon" data-exeditco="${i}" title="Edit CO">${I.edit}</button><button class="co-icon danger" data-exdelco="${i}" title="Delete CO">${I.trash}</button></div></div>`).join(''):`<div class="co-row" style="margin-bottom:8px;border-style:dashed;justify-content:center"><span class="meta">No course outcomes detected — add one.</span></div>`}
    <div class="section-label mt24 mb16">Detected structure — ${e.name} (${e.code})</div>
    ${e.units.map((u,ui)=>`<div class="unit"><div class="unit-head"><span class="un">Unit ${u.n}</span><span class="ut">${u.title}</span><span class="ct">${u.topics.length} topics</span><button class="co-icon" style="margin-left:10px" data-exaddtopic="${ui}" title="Add topic">${I.plus}</button></div>
      ${u.topics.map((t,ti)=>`<div style="padding:14px 18px;border-bottom:1px solid var(--w-border)"><div class="flex between center"><div style="min-width:0"><div style="font-family:var(--font-display);font-weight:600;font-size:14px;margin-bottom:6px">${t.name}</div><div class="co-meta mb8"><span class="comap">${coRefFor(e,ui)} · ${t.co.bloom}</span></div><div>${t.subs.map(s=>`<span class="subchip">${s}</span>`).join('')}</div></div><div class="co-actions"><button class="co-icon" data-exedittopic="${ui}.${ti}" title="Edit topic">${I.edit}</button><button class="co-icon danger" data-exdeltopic="${ui}.${ti}" title="Delete topic">${I.trash}</button></div></div></div>`).join('')}</div>`).join('')}

function coListSummary(c){

function coMapTable(c){

    ${cos.map(co=>`<tr><td><span class="course-code">${co.id}</span></td>${cols.map(col=>{const val=map[co.id]?.[col];return`<td>${val?`<span class="mapval mv${val}">${val}</span>`:`<span class="mapempty">–</span>`}</td>`;}).join('')}</tr>`).join('')}

function drawUnitTree(c){

function artCard(t,k){
  const def=ART_DEFS.find(d=>d.k===k);const p=t.artifacts[k];
  const notesReady=t.artifacts.notes>=100;
  const locked=k!=='notes'&&!notesReady&&p===0;
  let badge;
  if(p>=100)badge=`<span class="badge b-green"><span class="dot"></span>Ready</span>`;
  else if(p>0)badge=`<span class="badge b-info">${p}%</span>`;
  else if(locked)badge=`<span class="badge b-muted">Waiting</span>`;
  else badge=`<span class="badge b-orange">Pending</span>`;
  return`<div class="artifact"><div class="ahead"><div class="aico">${def.ico}</div><div style="flex:1"><div class="atitle">${def.label}</div><div class="asub">${def.sub}</div></div>${badge}</div>
    <div class="progress"><span style="width:${p}%"></span></div></div>`;
}
function drawFlow(t){
  $('#flow').innerHTML=`<div class="flow">
    <div class="flow-stage">${artCard(t,'notes')}</div>
    <div class="flow-conn">${I.arrow}</div>
    <div class="flow-stage"><div class="parallel">${artCard(t,'preassess')}${artCard(t,'quiz')}${artCard(t,'flash')}</div></div>
  </div>`;
}
function runTopicFlow(t){
  t.artifacts.notes=Math.max(t.artifacts.notes,5);syncTopicViews(t);
  const n=setInterval(()=>{
    t.artifacts.notes=Math.min(100,t.artifacts.notes+20);syncTopicViews(t);
    if(t.artifacts.notes>=100){clearInterval(n);startParallel(t);}
  },380);
}
function startParallel(t){
  ['preassess','quiz','flash'].forEach(k=>{
    t.artifacts[k]=Math.max(t.artifacts[k],5);
    const iv=setInterval(()=>{
      t.artifacts[k]=Math.min(100,Math.round(t.artifacts[k]+(14+Math.random()*10)));syncTopicViews(t);
      if(t.artifacts[k]>=100){t.artifacts[k]=100;clearInterval(iv);
        if(topicState(t)==='ready'){toast(`${t.name} · all artifacts ready`);maybeActivate();}}
    },360+Math.random()*200);
  });
}
function syncTopicViews(t){
  if(route==='topicPage'&&currentTopic.id===t.id)drawFlow(t);
  if(route==='coursePage')drawUnitTree(currentCourse);
  if(route==='generation')renderGeneration($('#view'),$('#topActions'));
  $('#navGenCount').textContent=pendingJobs();
}
function maybeActivate(){const c=currentCourse;if(!c)return;if(coursePct(c)>=100&&c.status==='draft'){c.status='active';toast(`${c.code} is now active`);}}
function openCoInline(t){
  const m=el(`<div class="modal-bg"><div class="modal">
    <div class="flex between center mb16"><div class="h3">Edit linked outcome</div><button class="co-icon" id="mx">${I.x}</button></div>
    <div class="lead mb24" style="font-size:13.5px">Editing the outcome statement or Bloom level for <b>${t.name}</b>. Saving will mark artifacts stale and offer to regenerate.</div>
    <div class="field"><label class="field-label">Outcome statement</label><textarea class="textarea" id="co_text">${t.co.text}</textarea></div>
    <div class="field"><label class="field-label">Bloom\u2019s level</label><select class="select" id="co_bloom">${BLOOM.map(b=>`<option ${b===t.co.bloom?'selected':''}>${b}</option>`).join('')}</select></div>
    <div class="flex between center mt24"><button class="btn btn-ghost" id="mc">Cancel</button>
      <div class="flex gap"><button class="btn btn-secondary" id="saveOnly">Save only</button><button class="btn btn-primary" id="saveRegen">${I.redo}Save & regenerate</button></div></div>
  </div></div>`);
  $('#modalRoot').appendChild(m);
  const close=()=>m.remove();
  m.querySelector('#mx').onclick=close;m.querySelector('#mc').onclick=close;m.addEventListener('click',e=>{if(e.target===m)close();});
  const apply=()=>{const tx=m.querySelector('#co_text').value.trim();if(tx)t.co.text=tx;t.co.bloom=m.querySelector('#co_bloom').value;};
  m.querySelector('#saveOnly').onclick=()=>{apply();close();render();toast('Outcome updated');};
  m.querySelector('#saveRegen').onclick=()=>{apply();t.artifacts=newArtifacts();close();render();runTopicFlow(t);toast('Outcome updated · regenerating');};
}

/* ===== Institute PO & PSO ===== */
function coursesForInstitute(name){return courses.filter(c=>(c.institute||'Winnify')===name);}
function renderInstitutes(v,a){

function renderInstituteDetail(v,a,ii){

function wireInstituteList(){
  const L=$('#instList');
  L.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openInstituteEditor(+b.dataset.edit));
  L.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const i=+b.dataset.del;if(confirm(`Delete institute "${institutes[i].name}"?`)){institutes.splice(i,1);currentInst=null;render();if($('#navInstCount'))$('#navInstCount').textContent=institutes.length;}});
  L.querySelectorAll('[data-addpo]').forEach(b=>b.onclick=()=>openOutcomeEditor(+b.dataset.addpo,'po',null));
  L.querySelectorAll('[data-editpo]').forEach(b=>b.onclick=()=>{const[ii,pi]=b.dataset.editpo.split('.').map(Number);openOutcomeEditor(ii,'po',pi);});
  L.querySelectorAll('[data-delpo]').forEach(b=>b.onclick=()=>{const[ii,pi]=b.dataset.delpo.split('.').map(Number);institutes[ii].pos.splice(pi,1);refreshInstitutes();});
  L.querySelectorAll('[data-addpso]').forEach(b=>b.onclick=()=>openOutcomeEditor(+b.dataset.addpso,'pso',null));
  L.querySelectorAll('[data-editpso]').forEach(b=>b.onclick=()=>{const[ii,pi]=b.dataset.editpso.split('.').map(Number);openOutcomeEditor(ii,'pso',pi);});
  L.querySelectorAll('[data-delpso]').forEach(b=>b.onclick=()=>{const[ii,pi]=b.dataset.delpso.split('.').map(Number);institutes[ii].psos.splice(pi,1);refreshInstitutes();});
}
function psoRow(p,ii){
  const idx=institutes[ii].psos.indexOf(p);
  return`<div class="co-row" style="margin-bottom:8px">
    <div class="co-id">${p.code}</div>
    <div class="co-body"><div class="co-text">${p.text}</div><div class="co-meta">${p.scope==='common'?'<span class="badge b-blue">Common</span>':`<span class="badge b-pink">${p.major||'Major'}</span>`}</div></div>

  </div>`;
}
function openOutcomeEditor(ii,kind,idx){
  const inst=institutes[ii];const editing=idx!==null;const isPso=kind==='pso';
  const arr=isPso?inst.psos:inst.pos;
  const o=editing?arr[idx]:(isPso?{code:'PSO'+(inst.psos.length+1),text:'',scope:'common',major:null}:{code:'PO'+(inst.pos.length+1),text:''});
  const m=el(`<div class="modal-bg"><div class="modal">
    <div class="flex between center mb16"><div class="h3">${editing?'Edit':'Add'} ${isPso?'PSO':'PO'} · ${inst.name}</div><button class="co-icon" id="mx">${I.x}</button></div>
    <div class="grid-2"><div class="field"><label class="field-label">Code</label><input class="input" id="o_code" value="${o.code}"></div>
    ${isPso?`<div class="field"><label class="field-label">Scope</label><select class="select" id="o_scope"><option value="common" ${o.scope==='common'?'selected':''}>Common (all majors)</option><option value="major" ${o.scope==='major'?'selected':''}>Major-specific</option></select></div>`:'<div></div>'}</div>
    ${isPso?`<div class="field" id="majWrap" style="${o.scope==='major'?'':'display:none'}"><label class="field-label">Major</label><select class="select" id="o_major">${MAJORS.map(mj=>`<option ${mj===o.major?'selected':''}>${mj}</option>`).join('')}</select></div>`:''}
    <div class="field"><label class="field-label">Statement</label><textarea class="textarea" id="o_text">${o.text}</textarea></div>
    <div class="flex between center mt24"><button class="btn btn-ghost" id="mc">Cancel</button><button class="btn btn-primary" id="ms">${I.check}${editing?'Save':'Add'}</button></div>
  </div></div>`);
  $('#modalRoot').appendChild(m);
  const close=()=>m.remove();
  m.querySelector('#mx').onclick=close;m.querySelector('#mc').onclick=close;m.addEventListener('click',e=>{if(e.target===m)close();});
  if(isPso){const sc=m.querySelector('#o_scope');sc.onchange=()=>{m.querySelector('#majWrap').style.display=sc.value==='major'?'':'none';};}
  m.querySelector('#ms').onclick=()=>{
    const code=m.querySelector('#o_code').value.trim()||o.code;
    const text=m.querySelector('#o_text').value.trim();if(!text){m.querySelector('#o_text').focus();return;}
    if(isPso){const scope=m.querySelector('#o_scope').value;const major=scope==='major'?m.querySelector('#o_major').value:null;
      const rec={code,text,scope,major};if(editing)arr[idx]=rec;else arr.push(rec);}
    else{const rec={code,text};if(editing)arr[idx]=rec;else arr.push(rec);}
    close();refreshInstitutes();
  };
}
function openInstituteEditor(ii){
  const editing=ii!==null;const inst=editing?institutes[ii]:{name:'',short:'',type:'',location:'',regulation:'',accreditation:'',pos:[],psos:[]};
  const m=el(`<div class="modal-bg"><div class="modal">
    <div class="flex between center mb16"><div class="h3">${editing?'Edit institute':'Add institute'}</div><button class="co-icon" id="mx">${I.x}</button></div>
    <div class="grid-2"><div class="field"><label class="field-label">Institute name</label><input class="input" id="i_name" value="${inst.name}" placeholder="e.g. CIET"></div>
    <div class="field"><label class="field-label">Short code</label><input class="input" id="i_short" value="${inst.short||''}" placeholder="CIET"></div></div>
    <div class="grid-2"><div class="field"><label class="field-label">Type</label><input class="input" id="i_type" value="${inst.type||''}" placeholder="Engineering College"></div>
    <div class="field"><label class="field-label">Location</label><input class="input" id="i_loc" value="${inst.location||''}" placeholder="Andhra Pradesh, IN"></div></div>
    <div class="grid-2"><div class="field"><label class="field-label">Regulation</label><input class="input" id="i_reg" value="${inst.regulation||''}" placeholder="CIET R24"></div>
    <div class="field"><label class="field-label">Accreditation</label><input class="input" id="i_acc" value="${inst.accreditation||''}" placeholder="NBA / NAAC"></div></div>
    ${!editing?`<div class="delta-banner" style="margin-top:6px">${I.info}<div class="txt">You can add POs and PSOs after creating the institute.</div></div>`:''}
    <div class="flex between center mt24"><button class="btn btn-ghost" id="mc">Cancel</button><button class="btn btn-primary" id="ms">${I.check}${editing?'Save institute':'Create institute'}</button></div>
  </div></div>`);
  $('#modalRoot').appendChild(m);
  const close=()=>m.remove();
  m.querySelector('#mx').onclick=close;m.querySelector('#mc').onclick=close;m.addEventListener('click',e=>{if(e.target===m)close();});
  m.querySelector('#ms').onclick=()=>{
    const name=m.querySelector('#i_name').value.trim();if(!name){m.querySelector('#i_name').focus();return;}
    const data={name,short:m.querySelector('#i_short').value.trim()||name.slice(0,3).toUpperCase(),type:m.querySelector('#i_type').value.trim(),location:m.querySelector('#i_loc').value.trim(),regulation:m.querySelector('#i_reg').value.trim(),accreditation:m.querySelector('#i_acc').value.trim()};
    if(editing)Object.assign(inst,data);
    else institutes.push({id:niid(),...data,pos:[],psos:[]});
    close();refreshInstitutes();if($('#navInstCount'))$('#navInstCount').textContent=institutes.length;
    toast(editing?'Institute updated':'Institute added');
  };
}

function renderGeneration(v,a){
  a.innerHTML=`<button class="icon-btn">${I.bell}</button>`;
  const rows=[];courses.forEach(c=>allTopics(c).forEach(x=>rows.push({c,u:x.unit,t:x.topic})));
  const pend=rows.filter(r=>topicState(r.t)!=='ready').length;
  v.innerHTML=`<div class="delta-banner mb24">${I.info}<div class="txt">Topics from finalized course plans land here. Each topic runs one flow — Teacher Notes first, then Pre-Assessment, Quiz & Flash Cards in parallel. <b>${pend} topics pending</b> across ${courses.length} courses.</div></div>
    <div class="card" style="padding:8px 12px"><table class="tbl"><thead><tr><th>Topic</th><th>Course</th><th>Status</th><th>Progress</th><th></th></tr></thead><tbody>
    ${rows.map((r,i)=>`<tr class="row" data-i="${i}">
      <td><div class="course-name" style="font-size:14px">${r.t.name}</div><div class="meta">Unit ${r.u.n} · ${r.t.subs.length} subtopics</div></td>
      <td><div class="course-code">${r.c.code}</div><div class="meta">${r.c.name}</div></td>
      <td>${topicBadge(r.t)}</td>
      <td style="min-width:150px"><div class="progress"><span style="width:${topicPct(r.t)}%"></span></div></td>
      <td style="text-align:right">${topicState(r.t)==='pending'?`<button class="btn btn-primary btn-sm" data-gen="${i}">${I.spark}Generate</button>`:`${I.chevron}`}</td>
    </tr>`).join('')}
    </tbody></table></div>`;
  v.querySelectorAll('tr.row').forEach(r=>{const i=+r.dataset.i;const rec=rows[i];
    r.onclick=e=>{if(e.target.closest('[data-gen]')){runTopicFlow(rec.t);return;}currentCourse=rec.c;currentTopic=rec.t;currentTopic._unit=rec.u;go('topicPage');};
  });
}

render();
</script>
</body>
</html>
