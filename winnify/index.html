<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover activates env(safe-area-inset-*) on notched iPhones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Winnify — AI-Powered Learning for Developers</title>
    <meta name="description" content="Learn tech skills faster with AI-powered interactive courses. Master system design, coding interviews, and more." />
    <!-- PWA / standalone -->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#07080d" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f6fa" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WinTeach Studio" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Fonts: preconnect + <link> rather than a CSS @import. An @import inside
         a stylesheet can't be discovered until that stylesheet has downloaded
         and parsed, so it serialises two round trips before any text paints.
         DM Sans + Space Grotesk are the studio's faces; the rest still load
         from their own CSS. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />
    <!-- Studio theme: resolve stored System/Light/Dark preference before first
         paint so the studio never flashes the wrong theme (mirrors studioTheme.ts). -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem('winnify_studio_theme') || 'dark';
          var dark = p === 'dark' || (p === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-st-theme', dark ? 'dark' : 'light');
          // Same idea for the reader's text size (studioTheme.ts) — applying it
          // after paint would visibly reflow the lesson a student is reading.
          var s = parseFloat(localStorage.getItem('winnify_studio_text_scale'));
          if (s === 0.92 || s === 1 || s === 1.12) {
            document.documentElement.style.setProperty('--st-font-scale', String(s));
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
