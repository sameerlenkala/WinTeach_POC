<svg viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sameer icon">
  <style>
    /* Base styles are the FINISHED mark — static renderers (Safari tabs, PNG
       rasterizers, pinned tabs) never run SVG animations, so the resting state
       must be fully drawn. Animations play FROM the hidden state instead
       (animation-fill-mode: backwards applies the `from` frame during delay). */
    .bar {
      stroke: #FFFFFF;
      stroke-width: 40;
      stroke-linecap: round;
      stroke-dasharray: 200;
      stroke-dashoffset: 0;
      animation: draw 0.5s cubic-bezier(0.22, 1, 0.36, 1) backwards;
    }
    .b1 { animation-delay: 0s; }
    .b2 { animation-delay: 0.12s; }
    .b3 { animation-delay: 0.24s; }

    .dot {
      fill: #b90e0a;
      transform-origin: 338px 160px;
      transform: scale(1);
      animation: pop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) 0.5s backwards;
    }
    .pulse {
      fill: none;
      stroke: #b90e0a;
      stroke-width: 3;
      transform-origin: 338px 160px;
      opacity: 0;
      animation: ring 0.9s ease-out 0.62s forwards;
    }

    @keyframes draw { from { stroke-dashoffset: 200; } to { stroke-dashoffset: 0; } }
    @keyframes pop  { from { transform: scale(0); } to { transform: scale(1); } }
    @keyframes ring {
      0%   { opacity: 0.6; transform: scale(1); }
      100% { opacity: 0;   transform: scale(2.2); }
    }

    @media (prefers-reduced-motion: reduce) {
      .bar { animation: none; }
      .dot { animation: none; }
      .pulse { animation: none; }
    }
  </style>

  <!-- Background -->
  <rect width="480" height="480" rx="112" fill="#0F0F10"/>

  <!-- S-mark: three bars, ascending stagger, varied length -->
  <line class="bar b1" x1="142" y1="316" x2="268" y2="316"/>
  <line class="bar b2" x1="176" y1="238" x2="322" y2="238"/>
  <line class="bar b3" x1="210" y1="160" x2="286" y2="160"/>

  <!-- Accent: red endpoint, lands last -->
  <circle class="dot" cx="338" cy="160" r="20"/>
  <circle class="pulse" cx="338" cy="160" r="20"/>
</svg>
